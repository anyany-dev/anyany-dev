name: Gerar animação das contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar as versões clara e escura da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anyany-dev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#EC4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C084FC

      - name: Publicar os arquivos na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
